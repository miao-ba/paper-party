name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Game templates still compile and pass the bot simulation
        run: |
          node scripts/new-game.mjs ci-turn
          node scripts/new-game.mjs ci-realtime --type realtime
          npm run typecheck
          npm test
